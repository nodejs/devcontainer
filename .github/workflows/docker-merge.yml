name: Merge images

on:
  workflow_dispatch: # allow re-merging the platform tags by hand
    inputs:
      sha:
        description: 'nodejs/node commit SHA whose platform images to merge (default: the current nightly-linux-<arch> tags)'
        type: string
        required: false
        default: ''
  workflow_call: # allow this workflow to be called by another workflow
    inputs:
      sha:
        type: string
        required: false
        default: ''

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
  REGISTRY: docker.io

concurrency:  # ensure only one merge runs at a time
  group: merge-manifest
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Merge the multiple architecture-specific images into a single multi-arch image.
      # If images for other architectures do not exist in the registry yet, this step will fail.
      # It will only succeed when at least one image for each architecture has been built and pushed.
      # When a manual run rebuilt only one platform, the other platform's existing image is
      # merged in unchanged.
      #
      # With a commit SHA, it merges that commit's platform images into both `nightly-<sha>` and `nightly`.
      # Merging by SHA keeps `nightly` from mixing platforms built from different commits when runs overlap.
      - name: Create multi-arch manifest
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if [ -n "$SHA" ]; then
            docker buildx imagetools create \
              -t ${REGISTRY}/${IMAGE}:nightly-${SHA} \
              -t ${REGISTRY}/${IMAGE}:nightly \
              ${REGISTRY}/${IMAGE}:nightly-${SHA}-linux-amd64 \
              ${REGISTRY}/${IMAGE}:nightly-${SHA}-linux-arm64
          else
            docker buildx imagetools create \
              -t ${REGISTRY}/${IMAGE}:nightly \
              ${REGISTRY}/${IMAGE}:nightly-linux-amd64 \
              ${REGISTRY}/${IMAGE}:nightly-linux-arm64
          fi

      - name: Verify multi-arch manifest
        run: |
          docker buildx imagetools inspect ${REGISTRY}/${IMAGE}:nightly
